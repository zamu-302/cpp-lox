<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lox.play</title>
<style>
  :root {
    --bg:    #000000;
    --panel: #0b0b0b;
    --line:  #232323;
    --text:  #ececec;
    --dim:   #777777;
    --red:   #ff2d2d;
    --mono:  ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.6 var(--mono);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--red); color: #000; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 1px solid var(--red); outline-offset: 2px; }

  /* ── layout ── */
  .app { display: grid; grid-template-rows: auto 1fr; height: 100%; max-width: 1400px; margin: 0 auto; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
  }
  .logo { font-weight: 700; letter-spacing: .02em; }
  .logo b { color: var(--red); }
  .status { color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .dot.ok { background: var(--text); }
  .dot.err { background: var(--red); }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; }
  .main { display: grid; grid-template-rows: minmax(0, 3fr) auto minmax(0, 2fr); min-height: 0; border-right: 1px solid var(--line); }

  /* ── editor ── */
  .editor { display: grid; grid-template-columns: 44px minmax(0, 1fr); min-height: 0; background: var(--panel); }
  .nums, textarea {
    font: inherit; line-height: 1.6; padding: 16px 0; white-space: pre;
  }
  .nums { text-align: right; padding-right: 12px; color: #3a3a3a; overflow: hidden; user-select: none; }
  textarea {
    background: transparent; color: var(--text); border: 0; resize: none; outline: 0;
    padding-left: 4px; padding-right: 16px; overflow: auto; caret-color: var(--red); tab-size: 4;
  }

  /* ── run bar ── */
  .bar {
    display: flex; align-items: center; gap: 16px; padding: 10px 20px;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  .run {
    background: var(--red); color: #000; font-weight: 700; padding: 5px 18px;
  }
  .run:hover:not(:disabled) { background: #fff; }
  .run:disabled { opacity: .4; cursor: default; }
  .link { color: var(--dim); }
  .link:hover { color: var(--text); }
  .hint { margin-left: auto; color: var(--dim); font-size: 12px; }
  kbd { border: 1px solid var(--line); padding: 0 5px; font: inherit; }

  /* ── output ── */
  .out { display: flex; flex-direction: column; min-height: 0; }
  .out-head { padding: 8px 20px; color: var(--dim); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; display: flex; justify-content: space-between; }
  #output { flex: 1; overflow: auto; padding: 0 20px 16px; white-space: pre-wrap; word-break: break-word; }
  .o-err { color: var(--red); }
  .o-sys { color: var(--dim); }
  .o-line { display: block; }

  /* ── side ── */
  aside { overflow: auto; min-height: 0; padding: 16px 20px 32px; }
  h2 {
    font-size: 11px; font-weight: 400; letter-spacing: .12em; text-transform: uppercase;
    color: var(--dim); margin: 22px 0 8px;
  }
  h2:first-child { margin-top: 0; }
  .ex { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .ex button { color: var(--text); padding: 1px 0; border-bottom: 1px solid transparent; }
  .ex button:hover { color: var(--red); border-bottom-color: var(--red); }
  .cs { list-style: none; }
  .cs li button {
    display: grid; grid-template-columns: 1fr auto; gap: 12px; width: 100%; text-align: left;
    padding: 4px 0; border-bottom: 1px solid var(--line);
  }
  .cs li button:hover .c { color: #fff; }
  .cs li button:hover .d { color: var(--red); }
  .c { color: var(--text); white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  .c i { color: var(--red); font-style: normal; }
  .d { color: var(--dim); font-size: 12px; text-align: right; }

  @media (max-width: 860px) {
    html, body { height: auto; }
    .app { height: auto; }
    .grid { grid-template-columns: 1fr; }
    .main { border-right: 0; grid-template-rows: 340px auto 240px; }
    aside { border-top: 1px solid var(--line); }
    .hint { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">lox<b>.</b>play</div>
    <div class="status"><span class="dot" id="dot"></span><span id="status">connecting</span></div>
  </header>

  <div class="grid">
    <div class="main">
      <div class="editor">
        <div class="nums" id="nums">1</div>
        <textarea id="editor" spellcheck="false" autocorrect="off" autocapitalize="off" aria-label="Lox source code"></textarea>
      </div>

      <div class="bar">
        <button class="run" id="run">run</button>
        <button class="link" id="clear">clear</button>
        <span class="hint"><kbd>ctrl</kbd> + <kbd>enter</kbd></span>
      </div>

      <div class="out">
        <div class="out-head"><span>output</span><span id="meta"></span></div>
        <div id="output"><span class="o-sys">press run</span></div>
      </div>
    </div>

    <aside>
      <h2>examples</h2>
      <div class="ex" id="examples"></div>

      <h2>cheat sheet</h2>
      <ul class="cs" id="cheat"></ul>
    </aside>
  </div>
</div>

<script>
// Same origin when served by server.py, otherwise fall back to localhost:3000
const SERVER = location.protocol.startsWith('http') ? location.origin : 'http://localhost:3000';

const $ = id => document.getElementById(id);
const editor = $('editor'), output = $('output'), nums = $('nums'),
      runBtn = $('run'), dot = $('dot'), statusEl = $('status'), meta = $('meta');

/* ───────── examples (replace the editor) ───────── */
const examples = {
  'hello':     'print "Hello, Lox!";',
  'fibonacci': 'fun fib(n) {\n  if (n < 2) return n;\n  return fib(n - 1) + fib(n - 2);\n}\n\nfor (var i = 0; i < 10; i = i + 1) {\n  print fib(i);\n}',
  'closure':   'fun makeCounter() {\n  var count = 0;\n  fun inc() {\n    count = count + 1;\n    return count;\n  }\n  return inc;\n}\n\nvar c = makeCounter();\nprint c();\nprint c();\nprint c();',
  'adders':    'fun makeAdder(n) {\n  fun add(x) { return n + x; }\n  return add;\n}\n\nvar add5 = makeAdder(5);\nvar add10 = makeAdder(10);\nprint add5(3);\nprint add10(3);\nprint add5(add10(2));',
  'scope':     'var x = "global";\n{\n  var x = "block";\n  print x;\n}\nprint x;',
  'class':     'class Dog {\n  init(name) { this.name = name; }\n  bark() { print this.name + " says woof"; }\n}\n\nvar d = Dog("Rex");\nd.bark();',
  'inherit':   'class Animal {\n  init(name) { this.name = name; }\n  speak() { print this.name + " makes a sound"; }\n}\n\nclass Dog < Animal {\n  speak() {\n    super.speak();\n    print this.name + " barks";\n  }\n}\n\nDog("Rex").speak();',
};

/* ───────── cheat sheet (insert at cursor) ───────── */
const cheat = [
  ['var x = 10;',               'variable',      'var x = 10;'],
  ['42  3.14  "hi"  true  nil', 'types',         'print 42;\nprint "hi";\nprint true;\nprint nil;'],
  ['+  -  *  /',                'arithmetic',    'print 1 + 2 * 3;'],
  ['==  !=  <  <=  >  >=',      'compare',       'print 3 <= 5;'],
  ['and  or  !',                'logic',         'print true and !false;'],
  ['"a" + "b"',                 'concat',        'print "a" + "b";'],
  ['print expr;',               'output',        'print "hello";'],
  ['// comment',                'comment',       '// comment'],
  ['{ ... }',                   'block scope',   '{\n  var x = 1;\n  print x;\n}'],
  ['if (c) { } else { }',       'branch',        'if (x > 0) {\n  print "pos";\n} else {\n  print "neg";\n}'],
  ['while (c) { }',             'loop',          'var i = 0;\nwhile (i < 3) {\n  print i;\n  i = i + 1;\n}'],
  ['for (init; c; step) { }',   'for loop',      'for (var i = 0; i < 3; i = i + 1) {\n  print i;\n}'],
  ['fun f(a, b) { }',           'function',      'fun add(a, b) {\n  return a + b;\n}\nprint add(1, 2);'],
  ['return value;',             'return',        'return x;'],
  ['class C { init() { } }',    'class',         'class C {\n  init(v) { this.v = v; }\n  get() { return this.v; }\n}'],
  ['class B < A { }',           'inherit',       'class B < A {\n}'],
  ['this.field',                'field',         'this.field = 1;'],
  ['super.method()',            'parent call',   'super.method();'],
  ['clock()',                   'native fn',     'print clock();'],
];
const KW = /\b(var|fun|class|return|if|else|while|for|print|this|super|and|or|nil|true|false)\b/g;
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

$('examples').innerHTML = Object.keys(examples)
  .map(k => `<button data-ex="${k}">${k}</button>`).join('');
$('cheat').innerHTML = cheat
  .map(([code, desc], i) =>
    `<li><button data-cs="${i}"><span class="c">${esc(code).replace(KW, '<i>$1</i>')}</span><span class="d">${desc}</span></button></li>`)
  .join('');

$('examples').addEventListener('click', e => {
  const k = e.target.dataset.ex; if (!k) return;
  editor.value = examples[k]; refreshNums(); editor.focus();
});
$('cheat').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  insertAtCursor(cheat[b.dataset.cs][2]);
});
function insertAtCursor(text) {
  const s = editor.selectionStart, t = editor.selectionEnd, v = editor.value;
  const pre = s > 0 && v[s - 1] !== '\n' ? '\n' : '';
  editor.value = v.slice(0, s) + pre + text + v.slice(t);
  editor.selectionStart = editor.selectionEnd = s + pre.length + text.length;
  refreshNums(); editor.focus();
}

/* ───────── editor niceties ───────── */
function refreshNums() {
  const n = editor.value.split('\n').length;
  nums.textContent = Array.from({length: n}, (_, i) => i + 1).join('\n');
  nums.scrollTop = editor.scrollTop;
}
editor.addEventListener('input', refreshNums);
editor.addEventListener('scroll', () => { nums.scrollTop = editor.scrollTop; });
editor.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart;
    editor.setRangeText('  ', s, editor.selectionEnd, 'end');
    refreshNums();
  } else if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault(); run();
  }
});
try { editor.value = localStorage.getItem('lox.code') || examples['fibonacci']; }
catch { editor.value = examples['fibonacci']; }
refreshNums();

/* ───────── output ───────── */
function line(text, cls = 'o-line') {
  const s = document.createElement('span');
  s.className = 'o-line ' + cls; s.textContent = text;
  output.appendChild(s);
}
function clearOut(msg) {
  output.innerHTML = msg ? `<span class="o-sys">${msg}</span>` : '';
  meta.textContent = '';
}
$('clear').onclick = () => clearOut('cleared');

/* ───────── server ───────── */
function setStatus(kind, text) { dot.className = 'dot ' + kind; statusEl.textContent = text; }
async function ping() {
  try {
    await fetch(SERVER + '/', { method: 'HEAD', signal: AbortSignal.timeout(2000) });
    setStatus('ok', 'ready'); runBtn.disabled = false;
    if (output.textContent.startsWith('server')) clearOut('press run');
  } catch {
    setStatus('err', 'offline'); runBtn.disabled = true;
    clearOut('server not reachable at ' + SERVER + '\nstart it with: python server.py');
    setTimeout(ping, 3000);
  }
}

async function run() {
  if (runBtn.disabled) return;
  const code = editor.value;
  try { localStorage.setItem('lox.code', code); } catch {}
  runBtn.disabled = true; runBtn.textContent = 'running';
  clearOut();
  const t0 = performance.now();
  try {
    const res = await fetch(SERVER + '/run', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code }), signal: AbortSignal.timeout(8000),
    });
    if (!res.ok) { line(`http ${res.status}`, 'o-err'); }
    else {
      const d = await res.json();
      const out = (d.stdout || '').trimEnd(), err = (d.stderr || '').trimEnd();
      if (out) out.split('\n').forEach(l => line(l));
      if (err) err.split('\n').forEach(l => line(l, 'o-err'));
      if (!out && !err) line('(no output)', 'o-sys');
      meta.textContent = `exit ${d.exitCode} · ${Math.round(performance.now() - t0)}ms`;
    }
  } catch (e) {
    line('could not reach server: ' + e.message, 'o-err');
    setStatus('err', 'offline'); setTimeout(ping, 3000);
  }
  runBtn.disabled = false; runBtn.textContent = 'run';
}
runBtn.onclick = run;

runBtn.disabled = true;
ping();
</script>
</body>
</html>
